<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lava Hop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120400;font-family:system-ui,Segoe UI,sans-serif;touch-action:none;color:#fff}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none}
#hud{display:flex;gap:8px;padding:12px;justify-content:space-between}
.card{min-width:68px;text-align:center;padding:7px 10px;border:1px solid #ff8a3d66;border-radius:12px;background:#160803bb;backdrop-filter:blur(8px)}
.label{font-size:9px;font-weight:900;letter-spacing:1.6px;color:#ff9d58}
.value{font-size:22px;font-weight:950;line-height:1.05}
#banner{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.8);opacity:0;font-weight:1000;text-align:center;text-shadow:0 3px 0 #5e1c00,0 0 20px #ff7a00;transition:.16s}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner .big{font-size:48px}
#banner .small{font-size:16px;letter-spacing:3px}
#menu,#dead{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#6a1606aa,#130300 68%);z-index:5;text-align:center;padding:24px}
#dead{display:none;background:#000b}
.title{font-size:clamp(48px,10vw,86px);font-weight:1000;letter-spacing:5px;color:#ff7a16;text-shadow:0 0 28px #ff2d00}
.sub{font-weight:800;letter-spacing:5px;color:#ffc18e;margin:0 0 24px}
button{pointer-events:auto;border:0;border-radius:15px;padding:14px 32px;margin:6px;min-width:220px;color:#fff;background:linear-gradient(135deg,#ff7a00,#e53900);font-size:18px;font-weight:950;letter-spacing:1px;cursor:pointer;box-shadow:0 6px 0 #6e1800,0 0 20px #ff620055}
button:active{transform:translateY(2px);box-shadow:0 4px 0 #6e1800}
.secondary{background:#2a1712}
.hint{margin-top:14px;color:#d98f66;font-size:12px;letter-spacing:1px}
#touch{display:none;position:fixed;left:12px;right:12px;bottom:12px;justify-content:space-between;align-items:flex-end;pointer-events:none}
.pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;gap:6px;pointer-events:auto}
.t{display:grid;place-items:center;border:2px solid #ffae6b88;border-radius:14px;background:#ff670044;color:#fff;font-size:24px;font-weight:900}
.up{grid-column:2}.left{grid-row:2}.down{grid-row:2;grid-column:2}.right{grid-row:2;grid-column:3}
.restart{pointer-events:auto;padding:14px 18px;border-radius:14px;background:#45140d;border:2px solid #ff764b88;font-weight:900}
@media (max-width:700px){#touch{display:flex}.card{min-width:54px;padding:6px 8px}.label{font-size:8px}.value{font-size:18px}}
@media (orientation:landscape) and (max-height:520px){#hud{padding:7px}.pad{grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px}.t{font-size:20px}.restart{padding:10px 14px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <div class="card"><div class="label">SCORE</div><div id="score" class="value">0</div></div>
    <div class="card"><div class="label">COMBO</div><div id="combo" class="value">x1</div></div>
    <div class="card"><div class="label">COINS</div><div id="coins" class="value">0</div></div>
    <div class="card"><div class="label">BEST</div><div id="best" class="value">0</div></div>
  </div>
  <div id="banner"><div class="big">NEAR MISS!</div><div class="small">COMBO +1</div></div>
  <div id="touch">
    <div class="pad">
      <div class="t up" data-m="0,1">↑</div>
      <div class="t left" data-m="-1,0">←</div>
      <div class="t down" data-m="0,-1">↓</div>
      <div class="t right" data-m="1,0">→</div>
    </div>
    <div id="restart" class="restart">↻ RESTART</div>
  </div>
</div>
<div id="menu">
  <div class="title">LAVA HOP</div>
  <div class="sub">Penguin's Great Escape</div>
  <button id="play">▶ PLAY ENDLESS</button>
  <button id="daily">🌋 DAILY CHALLENGE</button>
  <button id="rules" class="secondary">CONTROLS & RULES</button>
  <div class="hint">Arrow Keys / WASD · R restart · Tap or swipe on mobile · Gamepad supported</div>
</div>
<div id="dead">
  <div class="title" style="font-size:clamp(42px,9vw,76px)">RUN OVER!</div>
  <div id="cause" class="sub">THE LAVA GOT YOU</div>
  <div style="font-size:28px;font-weight:950">Score <span id="finalScore">0</span></div>
  <div id="pb" style="color:#ffd44a;font-weight:950;margin:6px 0">NEW PERSONAL BEST!</div>
  <button id="again">▶ PLAY AGAIN</button>
  <button id="back" class="secondary">MENU</button>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";

const canvas=document.getElementById("c");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x160502);
scene.fog=new THREE.Fog(0x160502,18,90);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,180);
camera.position.set(0,8,-7);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

scene.add(new THREE.HemisphereLight(0xffc9a0,0x180300,2.2));
const key=new THREE.DirectionalLight(0xffb15c,3.2);
key.position.set(-8,14,-6);key.castShadow=true;scene.add(key);
const lavaGlow=new THREE.PointLight(0xff4a00,6,22);scene.add(lavaGlow);

const cell=1.7, laneW=6;
const tiles=[], hazards=[];
let player,score=0,coins=0,combo=1,best=+(localStorage.lavaHopBest||0);
let z=1,x=0,targetZ=1,targetX=0,hopT=1,idle=0,state="menu",mode="normal",seed=1;
document.getElementById("best").textContent=best;

class RNG{constructor(s){this.s=(s>>>0)||1}next(){this.s^=this.s<<13;this.s^=this.s>>>17;this.s^=this.s<<5;return (this.s>>>0)/4294967296}pick(a){return a[Math.floor(this.next()*a.length)]}}
const rng=new RNG(1);

function hashDateUTC(){
 const d=new Date(), k=`${d.getUTCFullYear()}-${d.getUTCMonth()+1}-${d.getUTCDate()}`;
 let h=2166136261; for(const ch of k) h=Math.imul(h^ch.charCodeAt(0),16777619);
 return h>>>0;
}
function box(s,c){const m=new THREE.Mesh(new THREE.BoxGeometry(...s),new THREE.MeshStandardMaterial({color:c,roughness:.8}));m.castShadow=true;m.receiveShadow=true;return m}
function makePenguin(){
 const g=new THREE.Group();
 const body=box([.72,.85,.72],0x18212b);body.position.y=.55;g.add(body);
 const belly=box([.5,.5,.12],0xe7e3db);belly.position.set(0,.55,.37);g.add(belly);
 const head=box([.7,.55,.68],0x202b35);head.position.y=1.18;g.add(head);
 const beak=box([.24,.14,.22],0xffb400);beak.position.set(0,1.15,.48);g.add(beak);
 const helmet=box([.78,.18,.72],0xff6b00);helmet.position.y=1.5;g.add(helmet);
 const eyeMat=new THREE.MeshBasicMaterial({color:0xffffff});
 for(const sx of [-.17,.17]){const e=new THREE.Mesh(new THREE.BoxGeometry(.1,.1,.06),eyeMat);e.position.set(sx,1.28,.38);g.add(e)}
 const footMat=new THREE.MeshStandardMaterial({color:0xff9c00});
 for(const sx of [-.2,.2]){const f=new THREE.Mesh(new THREE.BoxGeometry(.3,.12,.4),footMat);f.position.set(sx,.12,.2);g.add(f)}
 return g;
}
player=makePenguin();scene.add(player);

function makeRow(kind,rowZ){
 const g=new THREE.Group();g.position.z=rowZ;
 if(kind==="lava"){
   const floor=box([laneW,0.18,cell],0x32100a);g.add(floor);
   floor.position.y=-.12;
   const top=box([laneW,.05,cell-.05],0xff3a00);top.material.emissive=new THREE.Color(0xff1a00);top.material.emissiveIntensity=1.7;g.add(top);
   const padCount=2+rng.pick([0,1]);
   for(let i=0;i<padCount;i++){
     const px=-2.1+i*(4.2/(padCount-1||1))+rng.next()*.5-.25;
     const pad=box([1.05,.25,.82],0x4b504f);pad.position.set(px,.16,0);pad.userData.float=true;g.add(pad);
   }
 } else {
   const base=box([laneW,.3,cell],kind==="road"?0x2e2f33:0x252018);
   base.position.y=-.1;g.add(base);
   if(kind==="road"){for(const lx of [-1.2,1.2]){const line=box([.06,.012,cell],0xd2c8a8);line.position.set(lx,.06,0);g.add(line)}}
   if(kind==="rail"){
     for(const lx of [-1.15,1.15]){const rail=box([.1,.12,cell],0x6b6b70);rail.position.set(lx,.08,0);g.add(rail)}
     for(let k=-.65;k<.8;k+=.35){const s=box([3,.08,.16],0x7d5c43);s.position.set(0,.04,k);g.add(s)}
   }
   if(kind==="grass"){const patch=box([laneW,.18,cell],0x244f2e);patch.position.y=.03;g.add(patch)}
 }
 scene.add(g);tiles.push({z:rowZ,kind,g});
 if(kind!=="grass"&&kind!=="lava"){
   const count=kind==="road"?1+(score>8?1:0):1;
   for(let i=0;i<count;i++){
     const obj=box([.85,.48,1.45],kind==="road"?0xd63a20:0x8f98a4);
     obj.position.set(rng.pick([-2,-.8,.8,2]),.38,rowZ);scene.add(obj);
     hazards.push({m:obj,z:rowZ,kind,s:rng.pick([1,1.25,-1,-1.25])*(1+score*.008)});
   }
 }
 return g;
}
function clearWorld(){
 for(const t of tiles)scene.remove(t.g);
 for(const h of hazards)scene.remove(h.m);
 tiles.length=0;hazards.length=0;
}
function generate(start=0, count=28){
 for(let r=start;r<start+count;r++){
   let kind="grass";
   if(r>1){
     const p=Math.min(.92,.30+r*.022+score*.006);
     const q=rng.next();
     if(q<p*.46)kind="road"; else if(q<p*.73)kind="rail"; else if(q<p)kind="lava";
   }
   makeRow(kind,r);
 }
}
function ensureWorld(){
 const max=Math.max(...tiles.map(t=>t.z));
 if(max-z<12)generate(max+1,18);
}
function tileAt(zz){return tiles.find(t=>Math.abs(t.z-zz)<.1)}
function canStand(nx,nz){
 const t=tileAt(nz); if(!t)return false;
 if(t.kind==="lava"){
   return t.g.children.slice(2).some(p=>Math.abs(p.position.x-nx)<.62);
 }
 return true;
}
function doMove(dx,dz){
 if(state!=="play"||hopT<1)return;
 const nx=Math.max(-2.45,Math.min(2.45,x+dx)), nz=z+dz;
 if(!canStand(nx,nz))return fail("YOU LANDED IN LAVA");
 targetX=nx;targetZ=nz;hopT=0;idle=0;score=Math.max(score,Math.round(nz-1));combo++; 
 const t=tileAt(nz); if(t&&t.kind==="grass"&&rng.next()<.2){coins++;document.getElementById("coins").textContent=coins}
 document.getElementById("score").textContent=score;document.getElementById("combo").textContent="x"+combo;
 ensureWorld();
 checkNearMiss();
}
function checkNearMiss(){
 for(const h of hazards){
   if(Math.abs(h.z-z)<.52 && Math.abs(h.m.position.x-x)<.9){nearMiss();break}
 }
}
function nearMiss(){
 document.getElementById("banner").classList.add("show");
 setTimeout(()=>document.getElementById("banner").classList.remove("show"),280);
 combo++;
 document.getElementById("combo").textContent="x"+combo;
}
function fail(msg){
 if(state!=="play")return;
 state="dead"; document.getElementById("cause").textContent=msg;
 document.getElementById("finalScore").textContent=score;
 const isPB=score>best; if(isPB){best=score;localStorage.lavaHopBest=best;document.getElementById("best").textContent=best;document.getElementById("pb").style.display="block"}else document.getElementById("pb").style.display="none";
 document.getElementById("dead").style.display="flex";
 let t=0; player.userData.fly={v:new THREE.Vector3((rng.next()-.5)*4,6,(rng.next()-.5)*3),t:0};
}
function start(m){
 mode=m;state="play";seed=m==="daily"?hashDateUTC():Math.floor(Math.random()*0xffffffff);rng.s=seed;
 score=0;coins=0;combo=1;idle=0;x=0;z=1;targetX=0;targetZ=1;hopT=1;player.rotation.set(0,0,0);player.position.set(0,.05,1);
 document.getElementById("score").textContent="0";document.getElementById("coins").textContent="0";document.getElementById("combo").textContent="x1";
 document.getElementById("menu").style.display="none";document.getElementById("dead").style.display="none";
 clearWorld();makeRow("grass",0);makeRow("grass",1);generate(2,32);
}
function backMenu(){state="menu";document.getElementById("dead").style.display="none";document.getElementById("menu").style.display="flex"}

function step(dt){
 if(state==="play"){
   idle+=dt; if(idle>5.5)fail("THE MAGMA PREDATOR CAUGHT YOU");
   if(hopT<1){
     hopT=Math.min(1,hopT+dt*6.8); const e=hopT<.5?hopT*2:2-hopT*2;
     player.position.x=THREE.MathUtils.lerp(x,targetX,hopT);
     player.position.z=THREE.MathUtils.lerp(z,targetZ,hopT);
     player.position.y=.05+Math.sin(Math.PI*hopT)*.72;
     const squ=1+Math.sin(Math.PI*hopT)*.16; player.scale.set(1/squ,squ,1/squ);
     player.rotation.x=.18*Math.sin(Math.PI*hopT); player.rotation.z=(targetX-x)*.15;
     if(hopT===1){x=targetX;z=targetZ;player.position.set(x,.05,z);player.scale.set(1,1,1);player.rotation.set(0,0,0)}
   }
   for(const h of hazards){
     h.m.position.x+=h.s*dt;
     if(h.m.position.x>3.6)h.m.position.x=-3.6;
     if(h.m.position.x<-3.6)h.m.position.x=3.6;
     if(Math.abs(h.m.position.x-x)<.65&&Math.abs(h.z-z)<.52&&hopT>.78&&hopT<1.02)fail(h.kind==="road"?"HIT BY TRAFFIC":"HIT BY TRAIN");
   }
 }
 for(const t of tiles) if(t.kind==="lava") for(const p of t.g.children) if(p.userData.float){p.position.y=.16+Math.sin(performance.now()*.002+p.position.x)*.05}
 if(player.userData.fly){
   const f=player.userData.fly;f.t+=dt;player.position.addScaledVector(f.v,dt);f.v.y-=13*dt;player.rotation.x+=dt*8;player.rotation.z+=dt*7;
   if(f.t>1.25){player.userData.fly=null}
 }
 const targetCamZ=player.position.z-6.3;
 camera.position.x+=(player.position.x*.35-camera.position.x)*dt*5;
 camera.position.y+=(8.2-camera.position.y)*dt*4;
 camera.position.z+=(targetCamZ-camera.position.z)*dt*4;
 camera.lookAt(player.position.x*.25,.65,player.position.z+2.6);
 lavaGlow.position.set(player.position.x,.5,player.position.z);
}

let prev=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-prev)/1000);prev=now;step(dt);renderer.render(scene,camera)}
loop();

const map={ArrowUp:[0,1],w:[0,1],W:[0,1],ArrowDown:[0,-1],s:[0,-1],S:[0,-1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
addEventListener("keydown",e=>{if(e.key==="r"||e.key==="R"){if(state!=="menu")start(mode);return}if(map[e.key]){e.preventDefault();doMove(...map[e.key])}});
document.querySelectorAll(".t").forEach(b=>b.onpointerdown=()=>doMove(...b.dataset.m.split(",").map(Number)));
document.getElementById("restart").onclick=()=>start(mode);
document.getElementById("play").onclick=()=>start("normal");
document.getElementById("daily").onclick=()=>start("daily");
document.getElementById("again").onclick=()=>start(mode);
document.getElementById("back").onclick=backMenu;
document.getElementById("rules").onclick=()=>alert("LAVA HOP\n\nHop one tile at a time. Dodge cars and trains. Cross lava using floating rocks and logs. Keep moving or the Magma Predator catches you. Collect coins, build combos, and beat your best score.\n\nKeyboard: Arrow Keys / WASD\nRestart: R\nMobile: buttons or swipe\nGamepad: D-pad / left stick");
let sx=0,sy=0;
addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener("touchend",e=>{if(state!=="play")return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy))doMove(dx>0?1:-1,0);else doMove(0,dy<0?1:-1)},{passive:true});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
